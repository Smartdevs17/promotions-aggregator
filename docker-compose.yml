services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: promotions
      POSTGRES_PASSWORD: promotions
      POSTGRES_DB: promotions
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promotions -d promotions"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: postgres://promotions:promotions@postgres:5432/promotions
    command: ["pnpm", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      API_PORT: 4000
      DATABASE_URL: postgres://promotions:promotions@postgres:5432/promotions
      REDIS_URL: redis://redis:6379
      SOURCE_PORTAL_URL: https://www.thepromenadeshopsatbriargate.com/sales
      SCRAPER_USER_AGENT: PromotionsAggregatorTakeHome/1.0
      SCRAPER_REQUEST_DELAY_MS: 500
      SCRAPER_CONCURRENCY: 2
      JOB_TIMEOUT_MS: 600000
    ports:
      - "4000:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      DATABASE_URL: postgres://promotions:promotions@postgres:5432/promotions
      REDIS_URL: redis://redis:6379
      SOURCE_PORTAL_URL: https://www.thepromenadeshopsatbriargate.com/sales
      SCRAPER_USER_AGENT: PromotionsAggregatorTakeHome/1.0
      SCRAPER_REQUEST_DELAY_MS: 500
      SCRAPER_CONCURRENCY: 2
      JOB_TIMEOUT_MS: 600000
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
